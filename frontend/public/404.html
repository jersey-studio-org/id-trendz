<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IDTrendz</title>
    <script>
      (function () {
        var pathname = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var pathSegments = pathname.split('/').filter(Boolean);
        // For custom domains (e.g. idtrendz.com), keep no path segment.
        // For project pages on github.io, keep the repo segment.
        var host = (window.location.hostname || '').toLowerCase();
        var isGithubHost = host.endsWith('.github.io');
        var repoBase = (isGithubHost && pathSegments.length > 0) ? '/' + pathSegments[0] : '';
        var routePath = pathname.slice(repoBase.length) || '/';
        var redirectUrl = repoBase + '/?p=' + encodeURIComponent(routePath) + '&q=' + encodeURIComponent(search) + hash;

        window.location.replace(redirectUrl);
      })();
    </script>
  </head>
  <body></body>
</html>
